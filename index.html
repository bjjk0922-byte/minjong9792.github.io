<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MinJong's Gallery</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      color: #111;
      overflow-x: hidden;
      /* 텍스트 드래그 및 모바일 콜아웃(이미지 저장 팝업) 방지 */
      -webkit-touch-callout: none; 
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none; 
    }

    /* 스크롤바 숨기기 */
    ::-webkit-scrollbar { width: 0px; background: transparent; }

    /* 불법 다운로드 방지용 클래스 */
    .protected-img {
      pointer-events: none;
      -webkit-user-drag: none;
    }
    
    .anti-theft-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: transparent;
      z-index: 10;
    }

    /* 갤러리 등장 애니메이션 (투명도 버그 해결을 위해 forwards -> both 로 변경) */
    .fade-in-up {
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeInUp {
      0% { transform: translateY(40px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* 트렌디한 앰비언트 글로우 애니메이션 */
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob {
      animation: blob 7s infinite;
    }
    .animation-delay-2000 {
      animation-delay: 2s;
    }

    /* 글래스모피즘 네비게이션바 */
    .glass-nav {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
    }

    /* 숨겨진 편집 모드 진입 버튼 */
    #hidden-admin-trigger {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      cursor: default;
      z-index: 9998;
    }
    
    #hidden-admin-trigger::after {
      content: '';
      position: absolute;
      bottom: 15px;
      left: 15px;
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.0);
      border: 1px solid rgba(255, 255, 255, 0.0);
      border-radius: 50%;
      transition: all 0.4s ease;
    }

    #hidden-admin-trigger:hover::after {
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(12px) saturate(150%);
      -webkit-backdrop-filter: blur(12px) saturate(150%);
      cursor: pointer;
    }

    /* 모달 및 라이트박스 배경 블러 */
    .modal-backdrop {
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }
    
    /* 캡처 방지용 화면 블러 (오류 방지를 위해 투명화 대신 강력한 블러만 적용) */
    .blur-screen {
      filter: blur(30px) !important;
      pointer-events: none !important;
      user-select: none !important;
    }
    
    /* 프린트 시 백지 출력 */
    @media print {
      body { display: none !important; }
    }
  </style>

  <!-- GSAP 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body class="antialiased selection:bg-gray-300 selection:text-black">

  <section class="h-[100dvh] flex flex-col justify-center items-center text-center px-4 relative overflow-hidden">
    <!-- 배경 글로우 요소 -->
    <div class="absolute top-[20%] left-[20%] w-72 h-72 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
    <div class="absolute top-[20%] right-[20%] w-72 h-72 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>
    
    <div class="relative z-10 flex flex-col items-center">
      <h1 class="text-6xl md:text-8xl font-bold tracking-tighter mb-6 gs-reveal text-gray-900 drop-shadow-sm">MinJong</h1>
      <h2 class="text-3xl md:text-4xl font-light tracking-tight mb-8 gs-reveal delay-100 text-gray-600">Visual Archive</h2>
      <p class="text-gray-400 text-sm md:text-base font-medium tracking-widest uppercase gs-reveal delay-200">Scroll to explore</p>
    </div>
    
    <div class="absolute bottom-12 animate-bounce text-gray-400 z-10">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
    </div>
  </section>

  <section id="preview-container" class="relative w-full h-[100dvh] overflow-hidden bg-[#f8f9fa]">
    <!-- JS를 통해 최신 이미지 혹은 대표 이미지가 원본 비율로 생성됩니다. -->
  </section>

  <section id="gallery-section" class="min-h-screen w-full flex flex-col items-center py-20 px-4 md:px-8 relative">
    
    <!-- 플로팅(글래스모피즘) 카테고리 필터 탭 -->
    <div class="sticky top-6 z-40 mb-12 gs-reveal">
      <div id="gallery-tabs" class="glass-nav flex space-x-1 p-1.5 rounded-full">
        <button class="filter-tab active px-6 py-2.5 rounded-full bg-white text-gray-900 shadow-sm text-sm font-semibold transition-all" data-filter="all">전체</button>
        <button class="filter-tab px-6 py-2.5 rounded-full text-gray-500 hover:text-gray-900 text-sm font-medium transition-all" data-filter="portrait">인물</button>
        <button class="filter-tab px-6 py-2.5 rounded-full text-gray-500 hover:text-gray-900 text-sm font-medium transition-all" data-filter="product">제품</button>
      </div>
    </div>

    <!-- 아카이브 갤러리 그리드 -->
    <div id="archive-grid" class="w-full max-w-7xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-10">
      <!-- JS를 통해 이미지가 여기에 주입됩니다. -->
    </div>
  </section>

  <div id="lightbox" class="fixed inset-0 z-[99999] hidden flex justify-center items-center bg-black/80 backdrop-blur-xl transition-opacity duration-500 opacity-0">
    <button id="lightbox-close" class="absolute top-8 right-8 text-white/50 hover:text-white transition-colors z-20">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
    <div class="relative w-full max-w-6xl max-h-[90vh] p-4 flex justify-center items-center">
      <img id="lightbox-img" src="" alt="Popup Image" class="max-w-full max-h-full object-contain shadow-2xl protected-img transition-transform duration-500 scale-95" referrerpolicy="no-referrer">
      <div class="anti-theft-overlay" id="lightbox-overlay"></div>
    </div>
  </div>

  <!-- 숨겨진 관리자(편집) 모드 진입 버튼 -->
  <div id="hidden-admin-trigger" title=""></div>

  <div id="custom-modal" class="fixed inset-0 z-[99999] hidden flex justify-center items-center modal-backdrop bg-black/40 transition-opacity duration-300 opacity-0">
    <div class="bg-white border border-gray-100 rounded-3xl p-8 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content">
      
      <div id="modal-auth-mode" class="hidden">
        <h3 class="text-xl font-bold mb-2 text-gray-900">System Access</h3>
        <p class="text-gray-500 text-sm mb-6">아카이브 편집 권한을 확인합니다.</p>
        <input type="password" id="admin-pwd-input" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-gray-900 focus:outline-none focus:border-black transition-colors mb-6 text-base" placeholder="Password" autocomplete="off">
        <div class="flex justify-end space-x-3">
          <button id="modal-cancel-btn" class="px-5 py-2.5 rounded-xl text-sm font-medium text-gray-500 hover:text-black transition-colors">Cancel</button>
          <button id="modal-submit-btn" class="px-5 py-2.5 bg-black text-white rounded-xl text-sm font-medium hover:bg-gray-800 transition-colors shadow-md">Access</button>
        </div>
      </div>

      <div id="modal-msg-mode" class="hidden text-center py-4">
        <div id="modal-icon" class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-green-50 mb-5">
          <svg class="h-7 w-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h3 id="modal-msg-title" class="text-xl font-bold text-gray-900 mb-2">Success</h3>
        <p id="modal-msg-desc" class="text-sm text-gray-500 mb-6">편집 모드가 활성화되었습니다.</p>
        <button id="modal-close-btn" class="w-full px-4 py-3 bg-black text-white rounded-xl text-sm font-medium hover:bg-gray-800 transition-colors shadow-md">Confirm</button>
      </div>

    </div>
  </div>

  <div id="admin-dashboard" class="fixed inset-0 z-[100000] hidden bg-[#f8f9fa] flex-col overflow-y-auto">
    <div class="max-w-5xl mx-auto w-full p-6 md:p-10">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-10 pb-6 border-b border-gray-200 gap-4">
        <h2 class="text-3xl font-bold text-gray-900 tracking-tight">Archive Management</h2>
        <div class="flex flex-wrap gap-3">
          <button id="export-html-btn" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-medium hover:bg-blue-700 transition-colors shadow-sm whitespace-nowrap">Save & Download HTML</button>
          <button id="close-admin-btn" class="px-5 py-2.5 bg-white border border-gray-200 text-gray-800 rounded-xl text-sm font-medium hover:bg-gray-50 transition-colors shadow-sm whitespace-nowrap">Exit Admin Mode</button>
        </div>
      </div>
      
      <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 mb-10">
        <h3 class="text-xl font-bold mb-2 text-gray-900">Add New Image</h3>
        <p class="text-sm text-gray-500 mb-6">구글 드라이브 이미지 공유 링크를 입력하시면 사파리 및 모든 브라우저에 최적화된 CDN 링크로 자동 변환되어 저장됩니다.</p>
        <div class="flex flex-col md:flex-row gap-3">
          <select id="img-category" class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-gray-900 focus:outline-none focus:border-black transition-colors min-w-[120px] font-medium text-base">
            <option value="portrait">인물</option>
            <option value="product">제품</option>
          </select>
          <input type="text" id="drive-link-input" class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-5 py-3.5 text-gray-900 focus:outline-none focus:border-black transition-all text-base" placeholder="https://drive.google.com/file/d/... 또는 이미지 URL" autocomplete="off">
          <button id="add-image-btn" class="px-8 py-3.5 bg-black text-white rounded-xl font-medium hover:bg-gray-800 transition-colors shadow-md whitespace-nowrap">Upload Link</button>
        </div>
      </div>

      <div class="flex justify-between items-end mb-6">
        <h3 class="text-xl font-bold text-gray-900">Current Archive Data</h3>
        <span class="text-sm text-gray-500 font-medium">Total: <span id="admin-img-count" class="font-bold text-gray-900">0</span></span>
      </div>
      <div id="admin-image-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">
      </div>
    </div>
  </div>

  <script>
    let originalHtmlTemplate = "";
    document.addEventListener("DOMContentLoaded", () => {
      originalHtmlTemplate = "<!DOCTYPE html>\n<html lang=\"ko\">\n" + document.documentElement.innerHTML + "\n</html>";
    });

    // --- GALLERY_DATA_START ---
    let rawData;
    try {
      rawData = JSON.parse(localStorage.getItem('galleryArchiveData'));
      if (!Array.isArray(rawData)) rawData = null;
    } catch(e) { rawData = null; }
    
    if (!rawData) {
      rawData = [
        { "src": "https://picsum.photos/id/1018/1200/800", "category": "portrait", "isPreview": true },
        { "src": "https://picsum.photos/id/1015/1200/800", "category": "product", "isPreview": true },
        { "src": "https://picsum.photos/id/1043/1200/800", "category": "portrait", "isPreview": true }
      ];
    }
    // --- GALLERY_DATA_END ---

    // [사파리 최적화] 기존에 잘못 저장된 구글 썸네일 주소가 있다면 ITP 우회용 CDN 링크(lh3)로 자동 치료합니다.
    let archiveImages = rawData.map((item, index) => {
      let data = typeof item === 'string' ? { src: item, category: 'portrait', isPreview: index < 3 } : { ...item };
      
      if (data.src.includes('drive.google.com/thumbnail') || data.src.includes('drive.google.com/uc')) {
        const driveIdMatch = data.src.match(/id=([a-zA-Z0-9_-]+)/);
        if (driveIdMatch) data.src = `https://lh3.googleusercontent.com/d/${driveIdMatch[1]}`;
      }
      data.isPreview = data.isPreview !== undefined ? data.isPreview : (index < 3);
      return data;
    });

    window.addEventListener('load', () => {
      gsap.registerPlugin(ScrollTrigger);

      gsap.from(".gs-reveal", {
        y: 40, opacity: 0, duration: 1.2, stagger: 0.15, ease: "power3.out", delay: 0.2
      });

      // 2. 동적 스크롤 미리보기 (원본 비율 유지 및 크롭 방지)
      const previewContainer = document.getElementById('preview-container');
      const previewImages = archiveImages.filter(img => img.isPreview);
      
      if (previewImages.length > 0) {
        previewImages.forEach((data, i) => {
          const panel = document.createElement('div');
          panel.className = 'panel absolute inset-0 w-full h-full flex justify-center items-center px-4 md:px-8';
          
          // aspect 비율을 삭제하고 max-w, max-h로 이미지 본연의 비율이 화면 안에서 최대한 크게 보이도록 수정
          panel.innerHTML = `
            <div class="relative rounded-2xl overflow-hidden shadow-2xl flex justify-center items-center max-w-full max-h-[85vh]">
              <img src="${data.src}" alt="미리보기 사진 ${i+1}" class="max-w-full max-h-[85vh] w-auto h-auto block protected-img" referrerpolicy="no-referrer">
              <div class="anti-theft-overlay"></div>
            </div>
          `;
          previewContainer.appendChild(panel);
        });

        const panels = gsap.utils.toArray('.panel');
        if (panels.length > 0) {
          gsap.set(panels.slice(1), { opacity: 0, y: 150, scale: 0.85 });
          
          const tl = gsap.timeline({
            scrollTrigger: {
              trigger: "#preview-container",
              pin: true,
              start: "top top",
              end: `+=${panels.length * 100}%`,
              scrub: 1.2,
            }
          });

          panels.forEach((panel, i) => {
            if (i === 0) return;
            tl.to(panels[i - 1], { opacity: 0, y: -100, scale: 0.9, duration: 1, ease: "power1.inOut" }, `seq${i}`)
              .to(panel, { opacity: 1, y: 0, scale: 1, duration: 1, ease: "power1.inOut" }, `seq${i}`);
          });
        }
      } else {
        previewContainer.style.display = 'none'; 
      }

      const gridContainer = document.getElementById('archive-grid');
      const filterTabs = document.querySelectorAll('.filter-tab'); 

      function renderArchiveImages(filter = 'all') {
        gridContainer.innerHTML = ''; 
        
        const filteredImages = filter === 'all' 
          ? archiveImages 
          : archiveImages.filter(img => img.category === filter);

        filteredImages.forEach((data, index) => {
          const imgWrapper = document.createElement('div');
          // opacity: '0'을 인라인 스타일에서 제거하여 애니메이션 투명도 충돌 버그 완벽 해결
          imgWrapper.className = 'relative w-full rounded-2xl overflow-hidden aspect-[3/4] bg-gray-100 fade-in-up shadow-sm hover:shadow-2xl transition-all duration-500 cursor-pointer group';
          imgWrapper.style.animationDelay = `${index * 0.05}s`; 

          const img = document.createElement('img');
          img.src = data.src; 
          img.className = 'w-full h-full object-cover protected-img transition-transform duration-700 ease-out group-hover:scale-110 block';
          img.alt = `Archive Image ${data.category}`;
          img.setAttribute('referrerpolicy', 'no-referrer'); // 사파리 보안 우회 필수

          const hoverOverlay = document.createElement('div');
          hoverOverlay.className = 'absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex justify-center items-center pointer-events-none z-10';
          hoverOverlay.innerHTML = `<div class="bg-white/30 backdrop-blur-md rounded-full p-4 transform scale-50 group-hover:scale-100 transition-transform duration-300"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg></div>`;

          const antiTheftOverlay = document.createElement('div');
          antiTheftOverlay.className = 'anti-theft-overlay z-20';

          imgWrapper.addEventListener('click', () => openLightbox(data.src));

          imgWrapper.appendChild(img);
          imgWrapper.appendChild(hoverOverlay);
          imgWrapper.appendChild(antiTheftOverlay);
          gridContainer.appendChild(imgWrapper);
        });
        
        // 레이아웃 변경 후 ScrollTrigger 재계산
        setTimeout(() => ScrollTrigger.refresh(), 500);
      }

      renderArchiveImages('all');

      filterTabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
          filterTabs.forEach(t => {
            t.classList.remove('bg-white', 'text-gray-900', 'shadow-sm', 'active');
            t.classList.add('text-gray-500');
          });
          e.target.classList.remove('text-gray-500');
          e.target.classList.add('bg-white', 'text-gray-900', 'shadow-sm', 'active');
          
          const filter = e.target.getAttribute('data-filter');
          renderArchiveImages(filter);
        });
      });

      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxClose = document.getElementById('lightbox-close');

      function openLightbox(src) {
        lightboxImg.src = src;
        lightbox.classList.remove('hidden');
        void lightbox.offsetWidth;
        lightbox.classList.remove('opacity-0');
        lightboxImg.classList.remove('scale-95');
        lightboxImg.classList.add('scale-100');
        document.body.style.overflow = 'hidden'; 
      }

      function closeLightbox() {
        lightbox.classList.add('opacity-0');
        lightboxImg.classList.remove('scale-100');
        lightboxImg.classList.add('scale-95');
        setTimeout(() => {
          lightbox.classList.add('hidden');
          lightboxImg.src = '';
          document.body.style.overflow = ''; 
        }, 500);
      }

      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target.id === 'lightbox-overlay') closeLightbox();
      });

      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('dragstart', e => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.key === "Escape" && !lightbox.classList.contains('hidden')) closeLightbox();
        if (
          e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) || 
          (e.ctrlKey && e.key === "U") || (e.metaKey && e.shiftKey && (e.key === "s" || e.key === "S" || e.key === "3" || e.key === "4" || e.key === "5")) ||
          e.key === "PrintScreen"
        ) {
          e.preventDefault();
          alert('보안 정책에 따라 캡처 및 코드 열람이 엄격히 제한됩니다.');
          return false;
        }
      });

      window.addEventListener('blur', () => document.body.classList.add('blur-screen'));
      window.addEventListener('focus', () => document.body.classList.remove('blur-screen'));

      const adminTrigger = document.getElementById('hidden-admin-trigger');
      const modal = document.getElementById('custom-modal');
      const modalContent = document.getElementById('modal-content');
      const modeAuth = document.getElementById('modal-auth-mode');
      const modeMsg = document.getElementById('modal-msg-mode');
      const pwdInput = document.getElementById('admin-pwd-input');
      const cancelBtn = document.getElementById('modal-cancel-btn');
      const submitBtn = document.getElementById('modal-submit-btn');
      const closeBtn = document.getElementById('modal-close-btn');

      function openModal(mode) {
        modal.classList.remove('hidden');
        modeAuth.classList.add('hidden');
        modeMsg.classList.add('hidden');
        
        if(mode === 'auth') {
          modeAuth.classList.remove('hidden');
          pwdInput.value = '';
          setTimeout(() => pwdInput.focus(), 100);
        } else if (mode === 'msg') {
          modeMsg.classList.remove('hidden');
        }

        requestAnimationFrame(() => {
          modal.classList.remove('opacity-0');
          modalContent.classList.remove('scale-95');
          modalContent.classList.add('scale-100');
        });
      }

      function closeModal() {
        modal.classList.add('opacity-0');
        modalContent.classList.remove('scale-100');
        modalContent.classList.add('scale-95');
        setTimeout(() => modal.classList.add('hidden'), 300);
      }

      adminTrigger.addEventListener('click', () => openModal('auth'));
      cancelBtn.addEventListener('click', closeModal);
      
      closeBtn.addEventListener('click', () => {
        if (pwdInput.value === 'minjong0922') {
          closeModal();
          openAdminDashboard(); 
        } else {
          closeModal();
        }
      });

      function handleLogin() {
        if (pwdInput.value === 'minjong0922') { 
          openModal('msg');
          document.getElementById('modal-msg-title').innerText = 'Access Granted';
          document.getElementById('modal-msg-title').classList.replace('text-red-500', 'text-gray-900');
          document.getElementById('modal-msg-desc').innerText = '관리자 모드가 활성화되었습니다.';
          document.getElementById('modal-icon').innerHTML = `<svg class="h-7 w-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
          document.getElementById('modal-icon').classList.replace('bg-red-50', 'bg-green-50');
        } else {
          openModal('msg');
          document.getElementById('modal-msg-title').innerText = 'Access Denied';
          document.getElementById('modal-msg-title').classList.replace('text-gray-900', 'text-red-500');
          document.getElementById('modal-msg-desc').innerText = '비밀번호가 일치하지 않습니다.';
          document.getElementById('modal-icon').innerHTML = `<svg class="h-7 w-7 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
          document.getElementById('modal-icon').classList.replace('bg-green-50', 'bg-red-50');
        }
      }

      submitBtn.addEventListener('click', handleLogin);
      pwdInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });

      const adminDashboard = document.getElementById('admin-dashboard');
      const closeAdminBtn = document.getElementById('close-admin-btn');
      const driveLinkInput = document.getElementById('drive-link-input');
      const imgCategorySelect = document.getElementById('img-category');
      const addImageBtn = document.getElementById('add-image-btn');
      const adminImageGrid = document.getElementById('admin-image-grid');
      const adminImgCount = document.getElementById('admin-img-count');
      const exportHtmlBtn = document.getElementById('export-html-btn');
      let tempArchiveImages = [];

      function openAdminDashboard() {
        tempArchiveImages = JSON.parse(JSON.stringify(archiveImages)); 
        adminDashboard.classList.remove('hidden');
        adminDashboard.classList.add('flex');
        renderAdminGrid();
      }

      closeAdminBtn.addEventListener('click', () => {
        archiveImages = JSON.parse(JSON.stringify(tempArchiveImages));
        localStorage.setItem('galleryArchiveData', JSON.stringify(archiveImages));
        
        adminDashboard.classList.add('hidden');
        adminDashboard.classList.remove('flex');
        location.reload();
      });

      function getDriveId(url) {
        const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
        return match ? match[1] : null;
      }

      addImageBtn.addEventListener('click', () => {
        const link = driveLinkInput.value.trim();
        const category = imgCategorySelect.value; 
        if (!link) return alert('이미지 링크를 입력해주세요.');

        let finalUrl = link;
        const driveId = getDriveId(link);
        
        // 사파리 ITP 우회 및 속도 최적화를 위해 구글usercontent 도메인 사용
        if (driveId) finalUrl = `https://lh3.googleusercontent.com/d/${driveId}`;

        tempArchiveImages.unshift({ src: finalUrl, category: category, isPreview: false }); 
        driveLinkInput.value = ''; 
        renderAdminGrid(); 
      });

      function renderAdminGrid() {
        adminImageGrid.innerHTML = '';
        adminImgCount.innerText = tempArchiveImages.length;

        tempArchiveImages.forEach((data, index) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'relative aspect-square bg-gray-100 rounded-2xl overflow-hidden group border border-gray-200 shadow-sm';

          const img = document.createElement('img');
          img.src = data.src;
          img.className = 'w-full h-full object-cover';
          img.setAttribute('referrerpolicy', 'no-referrer');
          
          const badge = document.createElement('span');
          badge.className = 'absolute top-3 left-3 bg-black/70 text-white text-xs px-2.5 py-1 rounded-md backdrop-blur-sm z-10 font-medium';
          badge.innerText = data.category === 'portrait' ? '인물' : '제품';

          const previewToggleBtn = document.createElement('button');
          previewToggleBtn.className = `absolute top-3 right-14 p-2 rounded-full shadow-lg z-10 transition-colors ${data.isPreview ? 'bg-yellow-400 text-white opacity-100' : 'bg-white/80 text-gray-600 opacity-0 group-hover:opacity-100 hover:bg-yellow-400 hover:text-white'}`;
          previewToggleBtn.innerHTML = '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
          previewToggleBtn.title = data.isPreview ? '대표 이미지 해제' : '대표 이미지로 지정';
          previewToggleBtn.onclick = () => {
            tempArchiveImages[index].isPreview = !tempArchiveImages[index].isPreview;
            renderAdminGrid(); 
          };

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'absolute top-3 right-3 bg-red-500 text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition-opacity shadow-lg z-10';
          deleteBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
          deleteBtn.onclick = () => {
            if(confirm('이 이미지를 삭제하시겠습니까?')) {
              tempArchiveImages.splice(index, 1);
              renderAdminGrid();
            }
          };

          wrapper.appendChild(img);
          wrapper.appendChild(badge);
          wrapper.appendChild(previewToggleBtn);
          wrapper.appendChild(deleteBtn);
          adminImageGrid.appendChild(wrapper);
        });
      }

      exportHtmlBtn.addEventListener('click', () => {
        const dataString = JSON.stringify(tempArchiveImages, null, 4);
        const dataReplacement = `// --- GALLERY_DATA_START ---\n    let rawData = JSON.parse(localStorage.getItem('galleryArchiveData')) || ${dataString};\n    // --- GALLERY_DATA_END ---`;
        
        function triggerDownload(htmlContent) {
          const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'index.html'; 
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(a.href);
          alert("✅ 성공적으로 저장되었습니다.\n다운로드된 파일로 기존 파일을 덮어쓰기 해주세요!");
        }

        fetch(window.location.href)
          .then(response => {
            if (!response.ok) throw new Error("Local env");
            return response.text();
          })
          .then(html => {
            triggerDownload(html.replace(/\/\/ --- GALLERY_DATA_START ---[\s\S]*?\/\/ --- GALLERY_DATA_END ---/, dataReplacement));
          })
          .catch(err => {
            console.log("로컬 환경 모드로 파일을 저장합니다.");
            let fallbackHtml = originalHtmlTemplate.replace(/\/\/ --- GALLERY_DATA_START ---[\s\S]*?\/\/ --- GALLERY_DATA_END ---/, dataReplacement);
            fallbackHtml = fallbackHtml.replace(/<style id="tailwindcss[^>]*>[\s\S]*?<\/style>/i, '');
            triggerDownload(fallbackHtml);
          });
      });

    });
  </script>
</body>
</html>
